# ==============================================================================
# GitHub Actions CI/CD Pipeline
# Part 7: DevOps, CI/CD, & Observability
# ==============================================================================
# Runs automated tests and gates deployment on their result.
# Triggers on push to main and pull requests.
# ==============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==================================================================
  # Job 1: Lint & Test
  # ==================================================================
  test:
    name: "Run Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_PATH: ":memory:"
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ==================================================================
  # Job 2: Build Docker Image
  # ==================================================================
  build:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    needs: test  # Gate: only build if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t linkedin-analytics:${{ github.sha }} .
          docker build -t linkedin-analytics:latest .

      - name: Test Docker image starts
        run: |
          docker run --rm \
            -e DATABASE_PATH=/app/data/test.db \
            -e PYTHONPATH=/app \
            linkedin-analytics:latest \
            python -c "from src.database.db_manager import initialize_database; initialize_database('/app/data/test.db'); print('✅ Docker image works')"

      - name: Save Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker save linkedin-analytics:latest | gzip > linkedin-analytics.tar.gz

      - name: Upload Docker image artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: linkedin-analytics.tar.gz

  # ==================================================================
  # Job 3: Data Quality Gate
  # ==================================================================
  dq-gate:
    name: "Data Quality Gate"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sample data and run DQ checks
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/generate_sample_data.py
          python scripts/run_dq_checks.py
